<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BISMILLAH BARAKA">
<link rel="manifest" href="manifest.json">
<title>BISMILLAH BARAKA</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--ok:#15803d;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:88px}
header{background:var(--accent);color:white;padding:18px 16px 16px;position:sticky;top:0;z-index:10}
.brand{font-weight:800;font-size:20px}.sub{opacity:.7;font-size:12px;margin-top:3px}
main{padding:14px}.section{display:none}.section.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 10px #00000008}
.menu-card{padding:0;overflow:hidden}.menu-img{height:125px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:42px}.menu-body{padding:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.price{font-weight:800}.muted{color:var(--muted);font-size:13px}.btn{background:var(--accent);color:#fff;border-radius:11px;padding:10px 13px;font-weight:700}.btn.light{background:#eef0f3;color:var(--text)}.btn.ok{background:var(--ok)}.btn.danger{background:var(--danger)}.btn.small{padding:7px 9px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20}.nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}
.nav button{background:none;color:var(--muted);font-size:11px;padding:5px 2px}.nav button.active{color:var(--text);font-weight:800}.nav-icon{display:block;font-size:20px}
h2{font-size:21px;margin:6px 0 14px}h3{margin:0 0 8px;font-size:16px}
.field{margin:9px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white}
.list{display:flex;flex-direction:column;gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.total{font-size:20px;font-weight:900}.pill{font-size:11px;padding:4px 7px;border-radius:20px;background:#eef0f3}.empty{text-align:center;padding:35px 10px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:50}.modal.show{display:flex}.sheet{background:white;width:100%;max-width:760px;margin:auto;border-radius:20px 20px 0 0;max-height:90vh;overflow:auto;padding:18px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat strong{display:block;font-size:21px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:100;font-size:13px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.bottom{left:50%;right:auto;width:100%;transform:translateX(-50%)}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">BISMILLAH BARAKA</div><div class="sub">Заказы • Себестоимость • Расходы</div></header>
<main>
<section id="orders" class="section active">
  <div class="row"><h2>Новый заказ</h2><span id="cartCount" class="pill">0 поз.</span></div>
  <div id="menuGrid" class="grid"></div>
  <div class="card" style="margin-top:12px">
    <div class="row"><h3>Текущий заказ</h3><button class="btn light small" onclick="clearCart()">Очистить</button></div>
    <div id="cart"></div>
    <div class="row" style="margin-top:12px"><span class="muted">Итого</span><span id="cartTotal" class="total">0 SAR</span></div>
    <div class="actions"><button class="btn ok" style="width:100%" onclick="acceptOrder()">ПРИНЯТЬ ЗАКАЗ</button></div>
  </div>
</section>

<section id="history" class="section">
  <div class="row"><h2>Заказы</h2><button class="btn light small" onclick="renderOrders()">Обновить</button></div>
  <div id="ordersList" class="list"></div>
</section>

<section id="menu" class="section">
  <div class="row"><h2>Меню</h2><button class="btn small" onclick="openMenuForm()">+ Блюдо</button></div>
  <div id="adminMenu" class="list"></div>
</section>

<section id="finance" class="section">
  <h2>Учёт</h2>
  <div class="statgrid">
    <div class="card stat"><div class="muted">Продажи</div><strong id="sSales">0 SAR</strong></div>
    <div class="card stat"><div class="muted">Себестоимость</div><strong id="sCost">0 SAR</strong></div>
    <div class="card stat"><div class="muted">Расходы</div><strong id="sExpenses">0 SAR</strong></div>
    <div class="card stat"><div class="muted">Результат</div><strong id="sProfit">0 SAR</strong></div>
  </div>
  <div class="actions" style="margin:14px 0"><button class="btn" onclick="openExpenseForm()">+ Расход</button><button class="btn light" onclick="openRecipeForm()">+ Техкарта</button></div>
  <div class="card"><h3>Расходы</h3><div id="expenseList" class="list"></div></div>
  <div class="card" style="margin-top:10px"><h3>Техкарты</h3><div id="recipeList" class="list"></div></div>
</section>
</main>

<div class="bottom"><div class="nav">
<button class="active" data-go="orders" onclick="go('orders',this)"><span class="nav-icon">🛒</span>Заказ</button>
<button data-go="history" onclick="go('history',this)"><span class="nav-icon">📋</span>Заказы</button>
<button data-go="menu" onclick="go('menu',this)"><span class="nav-icon">🍽️</span>Меню</button>
<button data-go="finance" onclick="go('finance',this)"><span class="nav-icon">📊</span>Учёт</button>
</div></div>
</div>

<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
